# =============================================================================
# Indian TTS — Colab Pro+ A100 Configuration
# =============================================================================
# Optimized for Google Colab Pro+ with A100 80GB GPU.
# Training time: ~24-32 hours for 200K steps.

# --- Model Architecture (same as base) ---
model:
  text_encoder:
    n_vocab: 256
    hidden_channels: 192
    filter_channels: 768
    n_heads: 2
    n_layers: 6
    kernel_size: 3
    dropout: 0.1

  posterior_encoder:
    in_channels: 513
    hidden_channels: 192
    out_channels: 192
    kernel_size: 5
    dilation_rate: 1
    n_layers: 16

  flow:
    hidden_channels: 192
    kernel_size: 5
    dilation_rate: 1
    n_layers: 4
    n_flows: 4

  decoder:
    in_channels: 192
    upsample_initial_channel: 512
    upsample_rates: [8, 8, 2, 2]
    upsample_kernel_sizes: [16, 16, 4, 4]
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]

  duration_predictor:
    hidden_channels: 192
    kernel_size: 3
    dropout: 0.5
    n_flows: 4
    filter_channels: 256

  n_speakers: 2
  speaker_embed_dim: 256

  discriminator:
    periods: [2, 3, 5, 7, 11]
    use_spectral_norm: false

# --- Audio ---
audio:
  sampling_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  mel_fmin: 0.0
  mel_fmax: null
  max_wav_value: 32768.0
  segment_size: 8192

# --- Training (A100 optimized) ---
training:
  learning_rate: 0.0002
  betas: [0.8, 0.99]
  eps: 1.0e-9
  weight_decay: 0.01
  lr_decay: 0.999875

  # A100 80GB can handle batch_size 48 comfortably
  # Reduce to 32 if using A100 40GB
  batch_size: 48
  accumulate_grad_batches: 1
  max_steps: 200000
  warmup_steps: 5000
  seed: 42

  loss_weights:
    mel: 45.0
    kl: 1.0
    duration: 1.0
    generator: 1.0
    discriminator: 1.0
    feature_matching: 2.0

  # Save frequently since Colab can disconnect
  save_every_n_steps: 5000
  eval_every_n_steps: 2500
  keep_last_n_checkpoints: 3
  log_every_n_steps: 50

  fp16: true
  grad_clip_norm: 1.0

# --- Data ---
data:
  training_files: "data/train.txt"
  validation_files: "data/val.txt"
  text_cleaners: ["indian_english_cleaners"]
  max_text_length: 300
  max_audio_length: 220500
  min_audio_length: 11025
  num_workers: 4
  pin_memory: true

# --- Inference ---
inference:
  noise_scale: 0.667
  noise_scale_w: 0.8
  length_scale: 1.0
  max_inference_length: 2000

# --- Paths ---
paths:
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"
  data_dir: "data"
